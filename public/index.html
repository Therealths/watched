<meta name="theme-color" content="#0F1116">
<script>
  // Applique le thème choisi dans le Profil avant l'affichage (évite un flash de l'autre thème).
  try { const t = localStorage.getItem('w2w.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
